<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<div class="card login-card">
    <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Inicia sesión</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category in ['success','danger','warning','info'] else 'info' }} mb-3" role="alert" data-remove-on-wait>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="post" {% if wait_seconds %}data-login-blocked="true"{% endif %}>
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control" type="text" id="username" name="username" required autofocus maxlength="64" value="{{ request.form.get('username', '') }}">
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group contenedor-password">
                    <input class="form-control password-input" type="password" id="password" name="password" required placeholder="Contraseña" maxlength="128">
                    <button class="btn btn-outline-secondary btn-pass-toggle" type="button"
                            data-toggle-password data-target="#password"
                            data-open-icon="{{ url_for('static', filename='img/open.png') }}"
                            data-close-icon="{{ url_for('static', filename='img/close.png') }}">
                        <img src="{{ url_for('static', filename='img/open.png') }}" alt="Ver" width="18" height="18">
                    </button>
                </div>
            </div>
            {% if wait_seconds %}
                <div class="alert alert-warning py-2" data-wait-seconds="{{ wait_seconds }}" data-remove-on-wait>
                    <span data-wait-label>Vuelve a intentarlo en {{ wait_seconds }}s</span>
                </div>
            {% endif %}
            <button class="btn btn-primary w-100" type="submit" data-login-submit {% if wait_seconds %}disabled{% endif %}>Entrar</button>
        </form>
    </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
